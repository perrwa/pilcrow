name: Build brand assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Cache Joan font
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fonts
          key: joan-font-${{ hashFiles('scripts/fetch-joan.mjs') }}

      - run: npm ci

      # Fetches Joan from GitHub, then marks -> raster -> favicon -> palette -> preview
      - run: npm run build

      - name: Commit regenerated assets
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand preview.html
          if git diff --staged --quiet; then
            echo 'assets already up to date'
            exit 0
          fi
          git commit -m 'chore: regenerate brand assets [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

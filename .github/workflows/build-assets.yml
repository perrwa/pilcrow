name: Build brand assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Fetches Joan from GitHub, then marks -> raster -> favicon -> palette -> preview
      - run: npm run build

      - name: Commit regenerated assets
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand preview.html
          if git diff --staged --quiet; then
            echo 'assets already up to date'
            exit 0
          fi
          git commit -m 'chore: regenerate brand assets [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

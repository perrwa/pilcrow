name: Build brand assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Cache Joan font
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fonts
          key: joan-font-${{ hashFiles('scripts/fetch-joan.mjs') }}

      - run: npm ci

      # Fetches Joan from GitHub, then marks -> raster -> favicon -> palette -> site
      - run: npm run build

      - name: Commit regenerated assets
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand
          if git diff --staged --quiet; then
            echo 'assets already up to date'
            exit 0
          fi
          git commit -m 'chore: regenerate brand assets [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

  sync-favicon:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fresh checkout (not the build job's workspace — separate runner) at
      # main, so this picks up whatever the build job just pushed, even
      # though that push is [skip ci] and won't start its own run.
      - name: Checkout pilcrow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: pilcrow

      - name: Require sync token
        env:
          SITE_SYNC_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
        run: |
          if [ -z "$SITE_SYNC_TOKEN" ]; then
            echo '::error::SITE_SYNC_TOKEN secret is not set — cannot sync favicon to perrwa.github.io'
            exit 1
          fi

      # GITHUB_TOKEN can't write to a different repo, so a PAT scoped to
      # just perrwa.github.io (contents+PRs: write) is used instead.
      # GITHUB_TOKEN-authored pushes also don't trigger workflows on the
      # target repo, which would leave the PR's required checks (verify,
      # lint-title) stuck pending forever.
      - name: Checkout perrwa.github.io
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: perrwa/perrwa.github.io
          token: ${{ secrets.SITE_SYNC_TOKEN }}
          path: site

      - name: Sync favicon files and open a PR
        env:
          GH_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
        run: |
          cp pilcrow/brand/favicon/favicon.svg site/public/favicon.svg
          cp pilcrow/brand/favicon/favicon.ico site/public/favicon.ico
          cp pilcrow/brand/favicon/apple-touch-icon.png site/public/apple-touch-icon.png

          cd site
          if git diff --quiet -- public/favicon.svg public/favicon.ico public/apple-touch-icon.png; then
            echo 'site favicon assets already up to date, nothing to sync'
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B perrwa/sync-favicon
          git add public/favicon.svg public/favicon.ico public/apple-touch-icon.png
          git commit -m 'chore: sync favicon from pilcrow'
          git push --force origin perrwa/sync-favicon

          if gh pr view perrwa/sync-favicon --repo perrwa/perrwa.github.io >/dev/null 2>&1; then
            echo 'PR already open on perrwa/sync-favicon, updated by the push above'
          else
            gh pr create --repo perrwa/perrwa.github.io \
              --base main --head perrwa/sync-favicon \
              --title 'chore: sync favicon from pilcrow' \
              --body 'Automated sync of favicon.svg, favicon.ico, and apple-touch-icon.png from perrwa/pilcrow'"'"'s brand/favicon/. Review the rendered mark (light + dark) before merging.'
          fi

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: perrwa/dotfiles/.github/workflows/node-ci.yml@09986fe5bed26be194ef2bf244c52cd12f9df450 # ci: add reusable node-ci.yml workflow (#4)
    with:
      cache-path: fonts
      cache-key-file: scripts/fetch-joan.mjs
      cache-key-prefix: joan-font
